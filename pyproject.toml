[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mry-benchmark"
version = "0.2.0"
description = "Independent evidence-grounded memory evaluation research"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
evaluation = ["httpx>=0.27,<1", "python-dotenv>=1,<2"]
beam = ["pyarrow>=15"]
adapter = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.34,<1"]
full = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pyarrow>=15",
  "pydantic>=2.10,<3",
  "python-dotenv>=1,<2",
  "uvicorn>=0.34,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/memory_benchmark"]

[tool.hatch.envs.default]
python = "3.12"
skip-install = true
dependencies = []

[tool.hatch.envs.default.env-vars]
PYTHONPATH = "{root}/src"

[tool.hatch.envs.default.scripts]
test = "python -m unittest discover -s tests -v"
inspect = "python -m memory_benchmark.core inspect-fixture"
schema = "python -m memory_benchmark.export_schema"
mock-http = "python tools/run_mock_acceptance.py"
scriptmem-smoke = "python tools/scriptmem_smoke.py"

[tool.hatch.envs.eval-fastapi]
python = "3.12"
features = ["full"]

[tool.hatch.envs.eval-fastapi.scripts]
benchmark = "python run_benchmark.py"

[tool.ruff]
target-version = "py312"
line-length = 120
